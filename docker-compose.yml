services:
  app:
    build:
      context: .
      target: dev
    container_name: auth_service_php_app
    ports:
      - "8001:80"
    env_file:
      - .env
    environment:
      - SERVER_NAME=:80
      - FRANKENPHP_CONFIG=${FRANKEN_WORKER:+worker /app/public/worker.php 0}
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_DRIVER=pgsql
      - DB_DATABASE=${DB_DATABASE:-backend_php_slim_db}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgrespw}
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - APP_URL=${APP_URL:-http://localhost:8001}
    volumes:
      - .:/app
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    entrypoint: ["/bin/bash", "/app/scripts/start.sh"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    develop:
      watch:
        - action: rebuild
          path: ./composer.json
        - action: rebuild
          path: ./composer.lock
        - action: rebuild
          path: ./Dockerfile
