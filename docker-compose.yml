services:
  app:
    build:
      context: .
      target: dev
    container_name: auth_service_php_app
    ports:
      - "8001:80"
    env_file:
      - .env
    environment:
      - SERVER_NAME=:80
      - FRANKENPHP_CONFIG=${FRANKEN_WORKER:+worker /app/public/worker.php 0}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DRIVER=pgsql
      - DB_DATABASE=${DB_DATABASE:-backend_php_slim_db}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgrespw}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - APP_URL=${APP_URL:-http://localhost:8001}
    volumes:
      - .:/app
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    entrypoint: ["/bin/bash", "/app/scripts/start.sh"]
    depends_on:
      - db
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
    develop:
      watch:
        - action: rebuild
          path: ./composer.json
        - action: rebuild
          path: ./composer.lock
        - action: rebuild
          path: ./Dockerfile

  db:
    image: postgres:15-alpine
    container_name: auth_service_php_db
    environment:
      POSTGRES_DB: backend_php_slim_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespw
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: auth_service_php_redis
    ports:
      - "6379:6379"
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
